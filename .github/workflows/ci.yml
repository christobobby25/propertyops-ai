name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check extracted data matches source dataset
        run: python -m scripts.extract_seed_data --check

      - name: Test (offline; emulator tests are skipped here)
        run: pytest

  emulator:
    name: Firestore emulator integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run emulator tests (no cloud credentials; fails if emulator is missing)
        run: scripts/run_emulator_tests.sh
